name: mercurius-example
log_destination: ./reviews
default_budget: 4
max_findings: 6
review_context: |
  Deployment context and constraints go here. Suppress findings that do not
  materially affect readiness under this context.
review_focus: |
  Pay particular attention to invariants specific to this project that the
  universal what-to-flag criteria do not already cover. Replace this with
  one or two project-specific concerns.
reviewers:
  - name: codex
    impl: codex
    model: gpt-5.5
