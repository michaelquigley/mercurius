# example user-level mercurius config, written by `mercurius bootstrap --user`
# to ~/.config/mercurius/config.yaml (or $XDG_CONFIG_HOME/mercurius/config.yaml).
# it holds the reviewer, set once for this installation and used by every
# project. project files (mercurius.yaml) hold calibration, max_findings, and
# log_destination; they do not name a reviewer.
#
# mercurius re-reads this file at the start of every round, so an edit here
# takes effect on the next round in every project.

# reviewer selects the harness that runs each round. impl is one of codex,
# claude, pi, or dummy. binary_path (optional) overrides the binary on PATH;
# extra_args (optional) are appended after the mercurius-managed flags. timeout
# (optional, default 20m) bounds one round; a relative binary_path resolves
# against this file's directory.
reviewer:
  name: codex
  impl: codex
  model: gpt-6.1-sol

# alternative reviewers - uncomment one and comment out the codex block above.
#
# claude code, run headless with native json-schema output. omit model to use
# the binary default; uses your logged-in claude credentials (pass --bare via
# extra_args with ANTHROPIC_API_KEY set for api-key-only auth).
# reviewer:
#   name: claude
#   impl: claude
#   model: sonnet
#
# pi (https://pi.dev), run headless in json-event mode. model uses the
# provider/id form. pi has no native schema enforcement; the schema is carried
# by the prompt and validated by mercurius after the round.
# reviewer:
#   name: pi
#   impl: pi
#   model: openai-codex/gpt-6.1-sol