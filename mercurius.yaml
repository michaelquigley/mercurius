# example mercurius.yaml. copy this into a project directory as
# `mercurius.yaml` and edit the fields below. fields omitted here fall back to
# sane defaults (log_destination: .mercurius, default_budget: 4,
# max_findings: 6). the project name is derived from the directory holding
# the config file.

default_budget: 4
max_findings: 6

# review_context describes project posture and constraints. it calibrates
# reviewer rigor by stating what's true about the project: deployment model,
# stakes, scope, locked decisions, simplicity-vs-defensiveness preference. the
# reviewer suppresses findings that do not materially apply under this context.
review_context: |
  mercurius is a small Go tool for design-agent review loops. pre-1.0 with
  one known user (the author); breaking config and protocol changes are
  acceptable. single supervised implementer; no production users. prefer
  simple over highly defensive when both achieve correctness. out of scope
  for now: panel mode, diff rounds, multi-tenant concerns, production-grade
  observability.

# review_focus directs the reviewer at project-specific surfaces that the base
# review philosophy does not already cover. the base prompt already carries
# the universal subtle-vs-obvious filter, so this field is typically just one
# paragraph naming the invariants or risks unique to this project.
review_focus: |
  pay particular attention to:

  - broker invariants that are easy to drift past in prose: atomic
    round-failure cleanup (no orphan logs, no partial snapshots, no budget
    consumption on failure), single-reviewer-per-session, and broker-owned
    prompt assembly (reviewers run their underlying tool and return raw
    output; they do not construct prompts).
  - decisions carry-forward: adjudicated findings must not be silently
    re-raised across rounds, and the prior-decisions prompt block must
    reflect what is in decisions.md.
  - MCP tool surface stability: parameter names, error codes, and response
    shapes are part of the contract design agents depend on.

reviewers:
  - name: codex
    impl: codex
    model: gpt-5.5
